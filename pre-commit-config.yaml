# ============================================================
#  .pre-commit-config.yaml — language-agnostic, generated by
#  test-workflow for any project. Drop into a repo root and run
#  `pre-commit install`. fail_fast stops at first broken hook.
#  (This file lives in the workflow repo as a TEMPLATE; copy it
#   into your project root to enable managed pre-commit hooks.)
# ============================================================
minimum_pre_commit_version: "3.5.0"
fail_fast: true

repos:
  # Generic hygiene (multi-language)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace
  # Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  # JS/TS via your own npm scripts (local repo)
  - repo: local
    hooks:
      - id: npm-lint
        name: npm lint
        entry: bash -c 'cd "$1" && npm run lint' _
        language: system
        files: ^.*/package\.json$
        pass_filenames: false
      - id: npm-test
        name: npm test
        entry: bash -c 'cd "$1" && npm run test:unit --if-present' _
        language: system
        files: ^.*/package\.json$
        pass_filenames: false
