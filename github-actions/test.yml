# ============================================================
#  .github/workflows/test.yml — shared CI for all projects
#  Copy this into any repo's .github/workflows/ folder.
#  Pipeline: lint -> unit -> integration -> e2e (fail-fast).
#  Auto-detects Python vs JS/TS per matrix stack and runs
#  the right tier. A failing tier FAILS THE JOB (exit 1) —
#  no `|| true` swallowing, so CI == local.
# ============================================================
name: test-workflow

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - stack: python
          - stack: node

    steps:
      - uses: actions/checkout@v4

      # --- Python path ---
      - name: Detect & run Python
        if: ${{ matrix.stack == 'python' }}
        shell: bash
        run: |
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || compgen -G "*.py" >/dev/null 2>&1; then
            echo "::group::Python tests"
            pip install --upgrade pip
            pip install ruff pytest pytest-cov pytest-mock freezegun
            ruff check --output-format concise .
            if [ -d tests ]; then
              pytest -q tests/
            else
              pytest -q .
            fi
            if [ -d tests_integration ]; then
              pytest -q tests_integration/
            fi
            if [ -d tests_e2e ]; then
              pytest -q tests_e2e/
            fi
            echo "::endgroup::"
          else
            echo "No Python project markers — skipping"
          fi

      # --- Node path ---
      - name: Detect & run Node
        if: ${{ matrix.stack == 'node' }}
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "::group::Node tests"
            npm install
            if grep -q '"lint"' package.json; then
              npm run lint
            fi
            if grep -q '"test:unit"' package.json; then
              npm run test:unit
            elif grep -q '"test"' package.json; then
              npm test
            fi
            if grep -q '"test:integ"' package.json; then
              npm run test:integ
            fi
            if grep -q '"test:e2e"' package.json; then
              npm run test:e2e
            fi
            echo "::endgroup::"
          else
            echo "No package.json — skipping"
          fi
